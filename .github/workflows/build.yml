# 빌드·시험·산출물. 태그 v* 면 GitHub Release 에 세 파일을 붙인다.
# 서명 정책 : Docs/Guide/코드서명정책.md
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: tag matches winres version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(grep -oP '"FileVersion":\s*"\K[^"]+' cmd/homegames-join/winres/winres.json)"
          [ "$want" = "$have" ] || { echo "tag v$want != winres FileVersion $have"; exit 1; }

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -count=1 ./...

      - name: version resource (go-winres)
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          cd cmd/homegames-join
          "$(go env GOPATH)/bin/go-winres" make --arch amd64

      - name: build
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o dist/homegames-join.exe ./cmd/homegames-join
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o dist/accessd ./cmd/accessd
          cd dist && sha256sum homegames-join.exe accessd > SHA256SUMS

      # SignPath 승인 뒤 여기서 artifact 를 signpath/github-action-submit-signing-request 로 넘긴다
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/homegames-join.exe
            dist/accessd
            dist/SHA256SUMS
